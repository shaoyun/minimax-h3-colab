<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Modern Isometric Creative Box / Prism -->
  <g transform="translate(64, 64)">
    <!-- Top Face -->
    <path d="M 0,-30 L 28,-14 L 0,2 L -28,-14 Z" fill="url(#facetTop)" />
    <!-- Left Face -->
    <path d="M -28,-14 L 0,2 L 0,34 L -28,18 Z" fill="url(#facetLeft)" />
    <!-- Right Face -->
    <path d="M 0,2 L 28,-14 L 28,18 L 0,34 Z" fill="url(#facetRight)" />

    <!-- Center Generative Aperture / Play Symbol -->
    <polygon points="6,9 6,27 21,18" fill="#ffffff" opacity="0.95" />
    <!-- Spark on Top Face -->
    <path d="M 0,-21 L 3,-14 L 10,-14 L 4,-10 L 6,-3 L 0,-8 L -6,-3 L -4,-10 L -10,-14 L -3,-14 Z" fill="#4f46e5" opacity="0.85" />
  </g>
</svg>
